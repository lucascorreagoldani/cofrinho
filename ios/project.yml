name: Cofrinho
options:
  bundleIdPrefix: com.lucas.cofrinho
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Cofrinho:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CofrinhoApp
    info:
      path: CofrinhoApp/Info.plist
      properties:
        CFBundleDisplayName: "Cofrinho"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSFaceIDUsageDescription: "O Cofrinho utiliza o Face ID para proteger seus dados financeiros e manter seu acesso seguro."
        NSLocalNetworkUsageDescription: "O Cofrinho precisa de acesso à rede local para se comunicar com o servidor backend durante o desenvolvimento."
        NSBonjourServices:
          - "_http._tcp"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - CofrinhoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.cofrinho.CofrinhoApp
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  CofrinhoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CofrinhoTests
    dependencies:
      - target: Cofrinho
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas.cofrinho.CofrinhoTests
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
